name = "github-ship-bots"
main = "packages/worker/src/index.ts"
compatibility_date = "2026-09-02"
compatibility_flags = ["nodejs_compat"]

# Set account_id via `wrangler deploy` or add it to your local wrangler.toml

[[d1_databases]]
binding = "DB"
database_name = "ship-feed-db"
database_id = "7da4a45d-039f-48a1-ab99-316d636568a3"
migrations_dir = "packages/api/migrations"

[[r2_buckets]]
binding = "EVIDENCE_BUCKET"
bucket_name = "ship-feed-evidence"

[[r2_buckets]]
binding = "BASELINE_BUCKET"
bucket_name = "ship-feed-baselines"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "cdbd999cc26c4ca2a48f9d2dec865104"

[assets]
directory = "docs"
binding = "ASSETS"

[vars]
PUBLIC_APP_URL = "https://github-ship-bots.newkubise.workers.dev"
GITHUB_APP_NAME = "wrikka-ship-bot"
VAPID_SUBJECT = "mailto:admin@newkubise.workers.dev"
AUTO_APPROVE_THRESHOLD = "8.5"
AUTO_APPROVE_RISK = "low"
OPENAI_REVIEW_MODE = "auto"
ELYSIA_AOT = "false"

# Set WORKOS_CLIENT_ID, WORKOS_REDIRECT_URI, STRIPE_PRICE_TEAM, and OPENAI_API_URL via wrangler secrets or .dev.vars

# Secrets: WORKOS_API_KEY, WORKOS_COOKIE_PASSWORD, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PRICE_PRO, STRIPE_PRICE_TEAM, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, BOT_TOKEN, GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY, GITHUB_WEBHOOK_SECRET, CRON_SECRET
