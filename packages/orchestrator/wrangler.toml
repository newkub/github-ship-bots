name = "ship-feed-orchestrator"
main = "src/worker.ts"
compatibility_date = "2024-08-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "ship-feed-db"
database_id = "7da4a45d-039f-48a1-ab99-316d636568a3"

[[r2_buckets]]
binding = "EVIDENCE_BUCKET"
bucket_name = "ship-feed-evidence"

[[r2_buckets]]
binding = "BASELINE_BUCKET"
bucket_name = "ship-feed-baselines"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "cdbd999cc26c4ca2a48f9d2dec865104"

[vars]
PUBLIC_APP_URL = "https://github-ship-bots.newkubise.workers.dev"

# Secrets: GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY

[triggers]
crons = ["*/10 * * * *"]
