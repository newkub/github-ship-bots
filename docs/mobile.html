<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#4f46e5" />
  <title>ship-feed mobile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { height: 100%; overflow: hidden; touch-action: pan-y; }
    .card-gradient { background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.7) 100%); }
  </style>
</head>
<body class="bg-gray-950 text-white h-screen flex flex-col">
  <div class="flex-1 relative overflow-hidden" id="feed">
    <!-- card -->
    <div class="absolute inset-0 w-full h-full bg-gray-900 flex flex-col justify-end">
      <div class="absolute top-0 left-0 right-0 p-6 flex justify-between z-10">
        <span class="px-3 py-1 rounded-full text-xs font-semibold bg-indigo-600/80 uppercase">idea</span>
        <span class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-600/80">score 10.0</span>
      </div>
      <div class="absolute inset-0 opacity-20 flex items-center justify-center">
        <svg class="w-40 h-40 text-white/50" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.59 14.37a6 6 0 01-5.84 7.38v-4.87m5.84-2.51a6 6 0 00-5.84-7.38v4.87m5.84 2.51h-5.84m5.84 0V17m-5.84-7.38V4.75M15.59 14.37H9.75" /></svg>
      </div>
      <div class="p-6 card-gradient z-10">
        <h2 class="text-2xl font-bold mb-2">Add mobile PWA swipe cards</h2>
        <p class="text-gray-200 text-sm mb-4">Build a TikTok-like mobile interface for approving and rejecting ship-feed cards.</p>
        <div class="flex items-center gap-4 text-xs text-gray-300 mb-4">
          <span>newkub/github-ship-bots</span><span>#1</span>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center text-xs mb-6">
          <div class="bg-black/30 rounded p-2"><div class="opacity-70 mb-1">impact</div><div class="font-semibold">high</div></div>
          <div class="bg-black/30 rounded p-2"><div class="opacity-70 mb-1">risk</div><div class="font-semibold">medium</div></div>
          <div class="bg-black/30 rounded p-2"><div class="opacity-70 mb-1">effect</div><div class="font-semibold">high</div></div>
        </div>
        <div class="flex justify-between items-center">
          <button class="h-14 w-14 rounded-full bg-red-500/90 flex items-center justify-center shadow-lg" onclick="swipe('reject')">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>
          </button>
          <button class="text-white/80"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" /></svg></button>
          <button class="h-14 w-14 rounded-full bg-emerald-500/90 flex items-center justify-center shadow-lg" onclick="swipe('approve')">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 9l-5 5m0 0l5 5m-5-5h12" /></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
  <nav class="h-16 bg-gray-900 border-t border-gray-800 flex shrink-0">
    <a href="mobile.html" class="flex-1 flex flex-col items-center justify-center text-indigo-400 text-xs py-2"><svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>Feed</a>
    <a href="mobile.html?tab=reviewed" class="flex-1 flex flex-col items-center justify-center text-gray-500 text-xs py-2"><svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>Reviewed</a>
    <a href="mobile.html?tab=account" class="flex-1 flex flex-col items-center justify-center text-gray-500 text-xs py-2"><svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>Account</a>
  </nav>
  <script>
    function swipe(dir) { alert(dir === 'approve' ? 'Approved!' : 'Rejected!'); }
  </script>
</body>
</html>
