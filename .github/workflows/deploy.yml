name: Deploy

on:
  push:
    branches: [main, dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0
      - run: bun install
      - run: bun --filter @ship-feed/landing build
      - run: bun --filter @ship-feed/web build
      - run: bun --filter @ship-feed/worker deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
