name: Disable Workers Builds

on:
  workflow_dispatch:

jobs:
  disable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Delete Workers Builds triggers
        env:
          CLOUDFLARE_BUILDS_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bun -e "
          const token = process.env.CLOUDFLARE_BUILDS_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const worker = 'github-ship-bots';

          if (!token || !accountId) {
            console.error('Missing CLOUDFLARE_BUILDS_TOKEN or CLOUDFLARE_ACCOUNT_ID');
            process.exit(1);
          }

          async function api(path, opts = {}) {
            const res = await fetch('https://api.cloudflare.com/client/v4' + path, {
              ...opts,
              headers: {
                Authorization: 'Bearer ' + token,
                'Content-Type': 'application/json',
              },
            });
            const text = await res.text();
            const data = text ? (() => {
              try { return JSON.parse(text); } catch { return { raw: text.slice(0, 500) }; }
            })() : null;
            if (!res.ok) throw new Error(res.status + ' ' + JSON.stringify(data));
            return data ? data.result : null;
          }

          const scripts = await api('/accounts/' + accountId + '/workers/scripts');
          const script = scripts.find(s => s.id === worker || s.name === worker);
          if (!script || !script.tag) {
            console.error('Worker', worker, 'not found or has no tag. Available:', scripts.map(s => s.id || s.name).join(', '));
            process.exit(1);
          }
          const tag = script.tag;
          console.log('worker tag:', tag);

          const triggers = await api('/accounts/' + accountId + '/builds/workers/' + tag + '/triggers');
          console.log('triggers found:', (triggers || []).length);

          for (const t of triggers || []) {
            const id = t.trigger_uuid;
            if (!id) {
              console.error('Trigger has no trigger_uuid', t);
              continue;
            }
            await api('/accounts/' + accountId + '/builds/triggers/' + id, { method: 'DELETE' });
            console.log('deleted trigger', id, t.trigger_name);
          }

          console.log('Workers Builds disabled for', worker);
          "
